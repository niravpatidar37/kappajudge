# Supply-chain updates: weekly, grouped, small PRs. Ecosystem names per
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python stays on 3.12 (requires-python <3.13; torch-era deps) and Postgres on 16 (matches Cloud SQL
  # POSTGRES_16 in Terraform): only patch/digest updates for those images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        versions: [">=3.13"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        versions: [">=17"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/staging
      - /infra/terraform/envs/prod
    schedule:
      interval: monthly
