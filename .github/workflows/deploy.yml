name: deploy

# Build once -> sign (keyless cosign) -> push to Artifact Registry -> STAGING (verify signature, migrate
# job, no-traffic canary, full smoke test scripts/smoke.py, eval-job preflight, promote, smoke again) ->
# PROD behind the `production` environment (manual approval): verify, migrate, canary at 0%, smoke,
# CANARY_PERCENT traffic, soak, smoke, 100%, smoke. Any failed smoke rolls the service (and the eval
# job image) back to the previous revision automatically.
#
# Every job is skipped until the repo variable GCP_PROJECT_ID is set (one-time bootstrap in
# docs/RUNBOOK.md), so this workflow passes while no cloud project is connected. Auth is keyless
# (Workload Identity Federation); `id-token: write` is granted only to deploy jobs. Image digests are
# deployed, never tags.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a rollout half-way; queue the next one instead

jobs:
  build:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # WIF + keyless cosign signing (Fulcio certificate bound to this workflow identity)
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: build and push (tag = commit sha; tags are immutable in the repo)
        id: push
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo="${REGION}-docker.pkg.dev/${PROJECT}/judgecal/kappajudge"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${repo}:${SHA}" .
          docker push "${repo}:${SHA}"
          digest="$(gcloud artifacts docker images describe "${repo}:${SHA}" --format='value(image_summary.digest)')"
          case "$digest" in sha256:*) ;; *) echo "no digest resolved"; exit 1 ;; esac
          echo "image=${repo}@${digest}" >> "$GITHUB_OUTPUT"
      - name: sign the digest (keyless; signature stored next to the image)
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: cosign sign --yes "$IMAGE"

  deploy-staging:
    needs: build
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      id-token: write # WIF + identity token for the IAP-protected smoke test
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      REGION: ${{ vars.GCP_REGION }}
      SVC: judgecal-staging-ui
      MIGRATE: judgecal-staging-migrate
      EVAL: judgecal-staging-eval
      API_KEY_SECRET: judgecal-staging-ui-api-keys
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_IAP_CLIENT_ID }} # IAP programmatic-access OAuth client (RUNBOOK)
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: verify the image signature (built and signed by this workflow on main)
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          cosign verify "$IMAGE" --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: run migrations (Cloud Run job, before any new code serves)
        run: |
          set -euo pipefail
          gcloud run jobs update "$MIGRATE" --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute "$MIGRATE" --region "$REGION" --wait
      - name: deploy no-traffic canary revision
        id: canary
        run: |
          set -euo pipefail
          prev="$(gcloud run services describe "$SVC" --region "$REGION" --format=json \
            | jq -r '[.status.traffic[] | select(.percent != null)] | max_by(.percent) | .revisionName')"
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"
          echo "prev_eval_image=$(gcloud run jobs describe "$EVAL" --region "$REGION" \
            --format='value(template.template.containers[0].image)')" >> "$GITHUB_OUTPUT"
          gcloud run deploy "$SVC" --region "$REGION" --container ui --image "$IMAGE" --no-traffic --tag canary --quiet
          url="$(gcloud run services describe "$SVC" --region "$REGION" --format='value(status.url)')"
          echo "canary_url=${url/https:\/\//https://canary---}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: smoke canary (scripts/smoke.py, 0% traffic)
        env:
          SMOKE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          URL: ${{ steps.canary.outputs.canary_url }}
        run: bash scripts/deploy_smoke.sh "$URL" "$RUNNER_TEMP/smoke-staging-canary.json"
      - name: scheduled eval job - new image + preflight (no model calls)
        run: |
          set -euo pipefail
          gcloud run jobs update "$EVAL" --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute "$EVAL" --region "$REGION" --args=-m,judgecal.evalrun,--smoke --wait
      - name: promote to 100%
        run: gcloud run services update-traffic "$SVC" --region "$REGION" --to-latest --quiet
      - name: smoke main URL
        env:
          SMOKE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          URL: ${{ steps.canary.outputs.url }}
        run: bash scripts/deploy_smoke.sh "$URL" "$RUNNER_TEMP/smoke-staging.json"
      - name: rollback service and eval job to the previous release
        if: ${{ failure() && steps.canary.outputs.prev != '' }}
        env:
          PREV: ${{ steps.canary.outputs.prev }}
          PREV_EVAL_IMAGE: ${{ steps.canary.outputs.prev_eval_image }}
        run: |
          gcloud run services update-traffic "$SVC" --region "$REGION" --to-revisions "${PREV}=100" --quiet
          if [ -n "$PREV_EVAL_IMAGE" ]; then gcloud run jobs update "$EVAL" --image "$PREV_EVAL_IMAGE" --region "$REGION" --quiet; fi
          echo "::error::rolled back ${SVC} to ${PREV}"
      - name: upload smoke summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-staging
          path: ${{ runner.temp }}/smoke-*.json
          if-no-files-found: ignore

  deploy-prod:
    needs: [build, deploy-staging]
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production # required reviewers = the manual approval gate
    permissions:
      contents: read
      id-token: write # WIF + identity token for smoke tests
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      REGION: ${{ vars.GCP_REGION }}
      SVC: judgecal-prod-ui
      MIGRATE: judgecal-prod-migrate
      EVAL: judgecal-prod-eval
      API_KEY_SECRET: judgecal-prod-ui-api-keys
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
      CANARY_PERCENT: "10"
      CANARY_SOAK_S: "300"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_IAP_CLIENT_ID }}
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: verify the image signature
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          cosign verify "$IMAGE" --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: run migrations
        run: |
          set -euo pipefail
          gcloud run jobs update "$MIGRATE" --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute "$MIGRATE" --region "$REGION" --wait
      - name: deploy no-traffic canary revision
        id: canary
        run: |
          set -euo pipefail
          prev="$(gcloud run services describe "$SVC" --region "$REGION" --format=json \
            | jq -r '[.status.traffic[] | select(.percent != null)] | max_by(.percent) | .revisionName')"
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"
          echo "prev_eval_image=$(gcloud run jobs describe "$EVAL" --region "$REGION" \
            --format='value(template.template.containers[0].image)')" >> "$GITHUB_OUTPUT"
          gcloud run deploy "$SVC" --region "$REGION" --container ui --image "$IMAGE" --no-traffic --tag canary --quiet
          new="$(gcloud run services describe "$SVC" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "canary") | .revisionName')"
          echo "new=${new}" >> "$GITHUB_OUTPUT"
          url="$(gcloud run services describe "$SVC" --region "$REGION" --format='value(status.url)')"
          echo "canary_url=${url/https:\/\//https://canary---}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: smoke canary revision (0% traffic, before any user traffic)
        env:
          SMOKE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          URL: ${{ steps.canary.outputs.canary_url }}
        run: bash scripts/deploy_smoke.sh "$URL" "$RUNNER_TEMP/smoke-prod-canary.json"
      - name: scheduled eval job - new image + preflight (no model calls)
        run: |
          set -euo pipefail
          gcloud run jobs update "$EVAL" --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute "$EVAL" --region "$REGION" --args=-m,judgecal.evalrun,--smoke --wait
      - name: shift canary traffic
        env:
          NEW: ${{ steps.canary.outputs.new }}
          PREV: ${{ steps.canary.outputs.prev }}
        run: |
          set -euo pipefail
          rest=$((100 - CANARY_PERCENT))
          gcloud run services update-traffic "$SVC" --region "$REGION" \
            --to-revisions "${NEW}=${CANARY_PERCENT},${PREV}=${rest}" --quiet
      - name: soak, then smoke under canary traffic (still before 100%)
        env:
          SMOKE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          URL: ${{ steps.canary.outputs.url }}
          CANARY_URL: ${{ steps.canary.outputs.canary_url }}
        run: |
          set -euo pipefail
          sleep "$CANARY_SOAK_S"
          bash scripts/deploy_smoke.sh "$CANARY_URL" "$RUNNER_TEMP/smoke-prod-canary-soak.json" --skip-rate-limit
          bash scripts/deploy_smoke.sh "$URL" "$RUNNER_TEMP/smoke-prod-split.json" --skip-rate-limit
      - name: promote to 100%
        env:
          NEW: ${{ steps.canary.outputs.new }}
        run: gcloud run services update-traffic "$SVC" --region "$REGION" --to-revisions "${NEW}=100" --quiet
      - name: smoke at 100%
        env:
          SMOKE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          URL: ${{ steps.canary.outputs.url }}
        run: bash scripts/deploy_smoke.sh "$URL" "$RUNNER_TEMP/smoke-prod.json" --skip-rate-limit
      - name: automatic rollback (service + eval job)
        if: ${{ failure() && steps.canary.outputs.prev != '' }}
        env:
          PREV: ${{ steps.canary.outputs.prev }}
          PREV_EVAL_IMAGE: ${{ steps.canary.outputs.prev_eval_image }}
        run: |
          gcloud run services update-traffic "$SVC" --region "$REGION" --to-revisions "${PREV}=100" --quiet
          if [ -n "$PREV_EVAL_IMAGE" ]; then gcloud run jobs update "$EVAL" --image "$PREV_EVAL_IMAGE" --region "$REGION" --quiet; fi
          echo "::error::rolled back ${SVC} to ${PREV}"
      - name: upload smoke summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-prod
          path: ${{ runner.temp }}/smoke-*.json
          if-no-files-found: ignore
